[project]
name = "libmarkdown"
version = "0.2.1"
description = "An idempotent Markdown read-write library with AST manipulation"
readme = "README.md"
authors = [
    { name = "Canrad", email = "1517807724@qq.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
